name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify registered experiment ledger
        run: python tools/experiment_registry.py --root artifacts/experiments_v3 verify
